server:
  port: 8104

spring:
  application:
    name: dubbo-business-example
#====================================Dubbo config===============================================
dubbo:
  application:
    name: dubbo-business-example
    qosEnable: false
  protocol:
    name: dubbo
    port: 10001
  registry:
    address: nacos://127.0.0.1:8848?namespace=lli-dubbo-seata-nacos-mysql&username=nacos&password=nacos
  consumer:
    retries: 0
#====================================Seata Config===============================================
seata:
  enabled: true
  application-id: business-seata-example
  tx-service-group: default_tx_group
  service:
    vgroup-mapping:
      default_tx_group: default
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: localhost:8848
      namespace: lli-dubbo-seata-nacos-mysql
      group: SEATA_GROUP
      cluster: default
      username: nacos
      password: nacos
  config:
    type: nacos
    nacos:
      server-addr: localhost:8848
      namespace: lli-dubbo-seata-nacos-mysql
      group: SEATA_GROUP
      dataId: seataServer.properties
      username: nacos
      password: nacos
  enable-auto-data-source-proxy: false
