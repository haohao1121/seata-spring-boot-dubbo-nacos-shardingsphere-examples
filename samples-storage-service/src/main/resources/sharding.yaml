dataSources:
  ds0:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://127.0.0.1:3306/ds2?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

rules:
  - !SHARDING
    tables:
      t_storage:
        actualDataNodes: ds0.t_storage$->{0..1}
        keyGenerateStrategy:
          column: id
          keyGeneratorName: snowflake
        tableStrategy:
          standard:
            shardingColumn: id
            shardingAlgorithmName: t_storage_inline
    shardingAlgorithms:
      t_storage_inline:
        type: INLINE
        props:
          algorithm-expression: t_storage$->{id % 2}
    keyGenerators:
      snowflake:
        type: SNOWFLAKE
        props:
          worker-id: 2

props:
  sql-show: true

transaction:
  defaultType: BASE
  providerType: Seata
